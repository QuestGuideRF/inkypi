<div class="form-group">
    <div class="form-group">
        <label for="padImage" class="form-label">Масштабируйте по размеру:</label>
        <div class="toggle-container">
            <input type="checkbox" id="padImage" name="padImage" class="toggle-checkbox" value="false">
            <label for="padImage" class="toggle-label"></label>
        </div>

        <input type="hidden" name="padImage" value="true">
    </div>
    <div class="form-group">
        <label for="randomize" class="form-label">Случайный порядок:</label>
        <div class="toggle-container">
            <input type="checkbox" id="randomize" name="randomize" class="toggle-checkbox" value="false"
                onclick="this.value = this.checked ? 'true' : 'false'">
            <label for="randomize" class="toggle-label"></label>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label" for="backgroundOption">Background:</label>
        <div class="form-group">
            <input type="radio" id="backgroundOption" name="backgroundOption" value="blur">
            <label>Blur</label>
            <input type="radio" id="backgroundOption" name="backgroundOption" value="color">
            <label>Color</label>
            <input type="color" id="backgroundColor" name="backgroundColor" value="#ffffff" class="color-picker"/>
        </div>
    </div>
</div>

<div class="form-group">
    <label for="imageUpload" class="form-input file-upload-label">Выберите изображение</label>
    <input type="file" clear-on-submit id="imageUpload" name="imageFiles[]" accept="image/*" multiple
           class="file-upload-input" onchange="addFiles()">
</div>

<div class="form-group">
    <div id="fileNames" class="file-name-list"></div>
</div>

<div id="hiddenFileInputs"></div>

<script>
    function addFiles() {
        const fileInput = document.getElementById("imageUpload");
        const fileNamesDisplay = document.getElementById("fileNames");

        const files = Array.from(fileInput.files);

        if (!uploadedFiles["файлы изображений[]"]) {
            uploadedFiles["файлы изображений[]"] = [];
        }

        files.forEach(file => {
            const fileName = file.name;

            // Предотвращение дублирования файлов
            if (!uploadedFiles["файлы изображений[]"].some(f => f.name === fileName)) {
                uploadedFiles["файлы изображений[]"].push(file);

                const fileElement = document.createElement("div");
                fileElement.innerHTML = `
                    <span id="fileNameText">${fileName}</span>
                    <button type="button" class="remove-btn" onclick="removeAddedFile('${fileName}')">X</button>
                `;
                fileElement.id = `добавлено-${fileName}`;
                fileElement.classList.add("file-name");
                fileElement.setAttribute('delete-on-submit', '');
                fileNamesDisplay.appendChild(fileElement);
            }
        });

        // Очистите ввод, чтобы при необходимости можно было снова добавить тот же файл.
        fileInput.value = "";
    }

    function removeAddedFile(fileName) {
        // Удалить файл из загруженных файлов
        uploadedFiles["файлы изображений[]"] = uploadedFiles["файлы изображений[]"].filter(f => f.name !== fileName);

        // Удалить отображаемое имя файла
        document.getElementById(`добавлено-${fileName}`).remove();
    }

    function removeExistingFile(fileName) {
        document.getElementById(`существующий-${fileName}`).remove(); // Удалить с отображения
        document.getElementById(`скрыто-${fileName}`).remove(); // Удалить скрытый ввод
    }

    // заполнить значения формы из настроек плагина
    document.addEventListener('DOMContentLoaded', () => {
        const fileNamesDisplay = document.getElementById("fileNames");
        const hiddenFileInputs = document.getElementById("hiddenFileInputs");
        let backgroundOption = "blur"
        if (loadPluginSettings) {
            document.getElementById('padImage').checked = pluginSettings.padImage == 'false';
            document.getElementById('randomize').checked = pluginSettings.randomize;
            document.getElementById('backgroundColor').value = pluginSettings.backgroundColor;

            const existingFiles = pluginSettings['файлы изображений[]'] || []
            backgroundOption = pluginSettings.backgroundOption || 'blur'

            // Прокрутите существующие файлы и добавьте их на экран и в скрытые входы.
            existingFiles.forEach(filePath => {
                const fileName = filePath.split('/').pop()
                // Создайте элемент для имени файла
                const fileElement = document.createElement("div");
                fileElement.innerHTML = `
                    <span id="fileNameText">${fileName}</span>
                    <button type="button" class="remove-btn" onclick="removeExistingFile('${fileName}')">X</button>
                `;
                fileElement.id = `существующий-${fileName}`;
                fileElement.classList.add("file-name");
                fileElement.setAttribute('delete-on-submit', '');
                fileNamesDisplay.appendChild(fileElement);

                // Создайте скрытый ввод для существующего файла
                const hiddenInput = document.createElement("input");
                hiddenInput.type = "hidden";
                hiddenInput.name = "файлы изображений[]";
                hiddenInput.value = filePath;
                hiddenInput.id = `скрыто-${fileName}`;
                hiddenInput.setAttribute('delete-on-submit', '');
                hiddenFileInputs.appendChild(hiddenInput);
            });
        }
        document.querySelector(`input[name="backgroundOption"][value="${backgroundOption}"]`).checked = true;
    });
</script>
